<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Joy Boy</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 flex flex-col items-center justify-center min-h-screen">
    <div id="errorBox" class="hidden text-red-500"></div>
    <div class="container mx-auto p-5">
        <div id="leagueEl" class="mb-4 text-xl font-bold"></div>
        <div id="dateEl" class="mb-4 text-lg"></div>
        <div id="windowEl" class="mb-4"></div>
        <div id="matchesEl" class="mb-4"></div>
        <div id="detailEl" class="mb-4"></div>
        <button id="autoBtn" class="bg-blue-500 text-white px-4 py-2 rounded">Auto</button>
        <input type="checkbox" id="includeFinishedEl" class="mt-4" /> Include Finished Matches
    </div>
    <script src="script.js"></script>
</body>
</html>
